name: tests

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mi_club
          POSTGRES_PASSWORD: mi_club
          POSTGRES_DB: mi_club_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mi_club"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: mi_club_test
      DB_USERNAME: mi_club
      DB_PASSWORD: mi_club

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          extensions: pdo_pgsql, gd, bcmath, intl

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - run: cp .env.example .env && php artisan key:generate

      - name: Extensiones de Postgres
        run: PGPASSWORD=mi_club psql -h 127.0.0.1 -U mi_club -d mi_club_test -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm;'

      - name: Pint
        run: vendor/bin/pint --test
      - name: Larastan
        run: vendor/bin/phpstan analyse --memory-limit=1G
      - name: TypeScript
        run: npm run types
      - name: Prettier
        run: npm run format:check
      - name: Build
        run: npm run build
      - name: Tests
        run: vendor/bin/pest
